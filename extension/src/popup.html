<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amy Brain Map 동기화</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; width: 330px; background: #100b20; color: #eee8ff; }
    main { padding: 18px; }
    h1 { margin: 0; font-size: 15px; }
    p { color: #c4b5fd; font-size: 12px; line-height: 1.5; }
    .card { margin-top: 13px; padding: 12px; border: 1px solid #5b3a91; border-radius: 10px; background: rgba(91, 58, 145, .18); }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 12px; }
    .label { color: #c4b5fd; }
    .value { color: #f5f3ff; text-align: right; max-width: 190px; overflow-wrap: anywhere; }
    .progress-track { height: 7px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: #2e2148; }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #a78bfa, #7c3aed); transition: width 180ms ease-out; }
    .progress-fill.is-syncing { box-shadow: 0 0 14px rgba(167, 139, 250, .72); }
    .sync-note { min-height: 18px; margin: 8px 0 0; color: #d8b4fe; font-size: 11px; line-height: 1.45; }
    .connection-card { margin-top: 13px; padding: 12px; border: 1px solid #8b5cf6; border-radius: 10px; background: rgba(124, 58, 237, .16); }
    .connection-card[hidden] { display: none; }
    .connection-card strong { color: #f5f3ff; font-size: 12px; }
    .connection-card p { margin: 6px 0 0; color: #ddd6fe; font-size: 11px; }
    button { width: 100%; min-height: 40px; margin-top: 8px; border: 0; border-radius: 8px; padding: 9px; font-weight: 700; cursor: pointer; background: #7c3aed; color: white; transition: background 180ms ease, opacity 180ms ease; }
    button:hover:not(:disabled) { background: #8b5cf6; }
    button:focus-visible, a:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button.secondary { background: #2e2148; border: 1px solid #604a8c; }
    button.secondary:hover:not(:disabled) { background: #3b2a5b; }
    button.danger { background: #4c1d35; border: 1px solid #9d174d; }
    a { display: block; margin-top: 12px; color: #ddd6fe; font-size: 12px; text-align: center; cursor: pointer; }
    .note { margin-top: 10px; color: #a99bbf; font-size: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Amy Brain Map 동기화</h1>
    <p>URL·제목·방문 시각·방문 횟수만 전송합니다. 페이지 본문은 별도 허용 전까지 수집하지 않습니다.</p>

    <section class="card" aria-live="polite">
      <div class="row"><span class="label">상태</span><strong class="value" id="status">확인 중</strong></div>
      <div class="row"><span class="label">진행률</span><span class="value" id="progress">0%</span></div>
      <div class="progress-track" role="progressbar" aria-label="Chrome 기록 동기화 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <p class="sync-note" id="syncNote">동기화 상태를 확인하고 있습니다.</p>
      <div class="row"><span class="label">대기 중</span><span class="value" id="queued">0건</span></div>
      <div class="row"><span class="label">최근 동기화</span><span class="value" id="lastSynced">-</span></div>
    </section>

    <section class="connection-card" id="connectionNotice" hidden>
      <strong>먼저 Chrome 기록을 연결하세요</strong>
      <p>웹 대시보드에서 연결 코드를 발급한 뒤, 아래 <strong>연결 설정 열기</strong>에서 앱 주소와 코드를 입력합니다.</p>
    </section>

    <button id="syncNow">지금 동기화</button>
    <button class="secondary" id="initialSync">Chrome 전체 기록 가져오기</button>
    <button class="danger" id="pause">수집 일시정지</button>
    <a id="openOptions" role="button" tabindex="0">연결 설정 열기</a>
    <div class="note">시크릿 모드 방문은 Chrome 방문 기록에 포함되지 않으며 이 확장 프로그램도 수집하지 않습니다.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
