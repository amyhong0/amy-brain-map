<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amy's Brain Office 연결 설정</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; min-width:480px; color:#eee8ff; background:#0b0815; } main { max-width:700px; margin:0 auto; padding:42px 32px; }
    h1 { margin:0; font-size:24px; } h2 { margin:0; font-size:15px; } p { color:#c4b5fd; font-size:13px; line-height:1.6; }
    .card { margin-top:22px; padding:20px; border:1px solid #4c3278; border-radius:14px; background:rgba(76,50,120,.18); }
    label { display:block; margin-top:15px; color:#d8b4fe; font-size:12px; font-weight:700; } input { box-sizing:border-box; width:100%; margin-top:7px; padding:11px; color:#fff; background:#120d22; border:1px solid #5d467e; border-radius:8px; outline:none; } input:focus { border-color:#a78bfa; }
    .check { display:flex; align-items:center; gap:8px; margin-top:17px; font-size:13px; color:#eee8ff; } .check input { width:16px; margin:0; }
    button { margin-top:20px; border:0; border-radius:8px; padding:11px 15px; color:#fff; font-weight:700; background:#7c3aed; cursor:pointer; } button:hover { background:#8b5cf6; }
    #status { min-height:20px; margin-top:14px; color:#c4b5fd; font-size:12px; } .notice { color:#a5b4fc; font-size:11px; }
  </style>
</head>
<body>
  <main>
    <h1>Amy’s Brain Office 연결</h1>
    <p>방문 기록은 당신이 지정한 개인 앱에만 동기화됩니다. 초기 수집 전까지는 아무 기록도 전송하지 않습니다.</p>
    <section class="card">
      <h2>개인 기록 금고</h2>
      <label>앱 주소<input id="endpoint" type="url" placeholder="예: https://amys-brain-office.vercel.app" /></label>
      <label>개인 보호 키<input id="token" type="password" placeholder="BROWSER_HISTORY_INGEST_TOKEN 값" /></label>
      <label class="check"><input id="enabled" type="checkbox" />방문 메타데이터 동기화 사용</label>
      <button id="save">연결 저장</button>
      <div id="status" role="status"></div>
    </section>
    <p class="notice">수집하는 정보는 URL·제목·방문 시각·방문 횟수입니다. 시크릿 모드 방문은 Chrome 방문 기록에 포함되지 않으며 이 확장 프로그램도 수집하지 않습니다. 페이지 본문은 이 확장 프로그램이 읽거나 전송하지 않습니다.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
